<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1118" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Upload your resume and get live matching internships and entry-level jobs in Korea, with the skills you are missing." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230e8f86'/%3E%3Cpath d='M9 17l5 5 9-11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
    <title>JobMatch.kr · AI Job & Internship Assistant</title>
    <style>
      /* Splash shown until React mounts (replaced by the app inside #root). */
      body { margin: 0; background: #f4f6f8; }
      .splash { position: fixed; inset: 0; display: grid; place-items: center; font-family: system-ui, sans-serif; color: #0e1726; }
      .splash-box { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .splash-logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.3rem; letter-spacing: -0.02em; }
      .splash-logo i { width: 36px; height: 36px; border-radius: 11px; background: #0e8f86; display: grid; place-items: center; animation: sp-pop 1.2s ease-in-out infinite; }
      .splash-logo b { color: #ef5b3b; }
      .splash-track { width: 180px; height: 4px; border-radius: 4px; background: #e2e7ee; overflow: hidden; }
      .splash-track span { display: block; width: 40%; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #0e8f86, #ef5b3b); animation: sp-slide 1.1s ease-in-out infinite; }
      .splash p { margin: 0; font-size: 0.85rem; color: #5b6678; }
      @keyframes sp-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes sp-pop { 50% { transform: scale(0.9); } }
      @media (prefers-color-scheme: dark) {
        body { background: #0b1118; }
        .splash { color: #e8eef5; }
        .splash-logo i { background: #2fd1c1; }
        .splash-track { background: #223042; }
        .splash p { color: #8fa0b5; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Loading">
        <div class="splash-box">
          <div class="splash-logo">
            <i><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg></i>
            <span>JobMatch<b>.kr</b></span>
          </div>
          <div class="splash-track"><span></span></div>
          <p>Loading…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
